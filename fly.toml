# fly.toml app configuration file generated for splitbot-muddy-dawn-5545 on 2026-03-25T22:20:05+01:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'splitbot-muddy-dawn-5545'
primary_region = 'ams'

[build]

[env]
  DATABASE_PATH = '/data/splitbot.db'
  LOG_FILE = '/data/splitbot.log'
  LOG_LEVEL = 'INFO'

[processes]
  app = 'python main.py'

[[mounts]]
  source = 'bot_data'
  destination = '/data'


[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256

[machine]
  auto_stop = false
